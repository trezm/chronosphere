name: Test portable skills
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    # ubuntu-latest moved to 26.04, which has no Python 3.9 build for setup-python.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: npm test
